name: Release

# Tag-driven release: push a tag like v1.2.3 (matching package.json's version)
# to publish to npm, create a GitHub release, and update the MCP Registry.
#
# npm auth: trusted publishing (GitHub OIDC) once it is configured on
# npmjs.com — no secret needed. Until then (the very first publish), the
# NPM_TOKEN repo secret is used as a fallback. See docs/MAINTENANCE.md.
# The MCP Registry step needs no secret: it authenticates via GitHub OIDC.
#
# Re-running a failed release is safe: the npm publish and GitHub release
# steps skip themselves when that version/release already exists.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC for npm trusted publishing, provenance and mcp-publisher

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$(npm --version)" || npm install -g npm@^11.5.1
          echo "npm $(npm --version)"

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != package.json v$PKG_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install pinned tdl
        run: |
          TDL_INSTALL_DIR="$RUNNER_TEMP/tdl-bin" bash scripts/install-tdl.sh
          echo "$RUNNER_TEMP/tdl-bin" >> "$GITHUB_PATH"

      - name: Test
        run: npm test

      - name: Publish to npm
        run: |
          SPEC="$(node -p 'require("./package.json").name')@${GITHUB_REF_NAME#v}"
          if npm view "$SPEC" version > /dev/null 2>&1; then
            echo "$SPEC is already on npm — skipping publish"
          else
            npm publish
          fi
        env:
          # npm tries OIDC trusted publishing first and falls back to this token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Create GitHub release
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install mcp-publisher
        run: |
          # Direct asset URL: the release also ships registry_linux_amd64.tar.gz,
          # so pattern-matching the asset list picks up two URLs.
          curl -fsSL --retry 3 -o /tmp/mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          sudo install -m 0755 /tmp/mcp-publisher /usr/local/bin/mcp-publisher

      - name: Publish to MCP Registry
        run: |
          # server.json's version fields track package.json at publish time.
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync("server.json", "utf8"));
            const v = process.argv[1];
            s.version = v;
            for (const p of s.packages || []) p.version = v;
            fs.writeFileSync("server.json", JSON.stringify(s, null, 2) + "\n");
          ' "$PKG_VERSION"
          mcp-publisher login github-oidc
          mcp-publisher publish
